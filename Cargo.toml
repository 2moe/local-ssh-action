[package]
name = "ssh-action-wasm"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/2moe/local-ssh-action"

[lib]
crate-type = ["cdylib"]

[profile.release]
# debug = false
strip = true
lto = "fat"
opt-level = 3

[dependencies]
wasm-bindgen = "0.2.95"
clg = "0.0.3"
shlex = { version = "1.3.0", default-features = false }
log = "0.4.22"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
# wasm-opt = false
